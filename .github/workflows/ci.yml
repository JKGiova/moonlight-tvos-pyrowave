name: Development checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize only the pinned codec for CPU interoperability checks
        run: git submodule update --init third_party/pyrowave
      - name: Parser and real codec CPU tests
        run: python3 tools/run_portable_tests.py --sanitize
      - name: Verify the portable shader's embedded runtime source
        run: python3 tools/embed_apple5_shader.py --check
      - name: CMake portable build and tests
        run: |
          cmake -S . -B build/cmake -DBUILD_METAL_VIDEO_TOOL=OFF
          cmake --build build/cmake --parallel 2
          ctest --test-dir build/cmake --output-on-failure
      - name: Install FFmpeg for functional video encoding checks
        timeout-minutes: 6
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            timeout 180 sudo apt-get update
            timeout 180 sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
      - name: Encode generated motion/gradient/text video with baseline codecs
        run: python3 tools/encode_test_video.py --codecs h264,hevc --width 320 --height 180 --fps 30 --frames 12
      - name: Check baseline encoding and reconstruction at 720p60
        run: python3 tools/encode_test_video.py --codecs h264,hevc --width 1280 --height 720 --fps 60 --frames 30 --output-dir benchmarks/local/720p60-smoke
  metal-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: git submodule update --init third_party/pyrowave
      - run: python3 tools/build_engine.py
      - name: Exercise host dashboard transport, state transitions and cancellation
        run: |
          xcrun clang++ -x objective-c++ -std=c++17 -fobjc-arc -Wall -Wextra -Werror -Wno-unused-parameter -I tests/host_support -I native/apple -I native/client tests/host_network_tests.mm tests/host_support/HostFixtures.mm native/apple/MLHostProbeSession.m native/apple/MLHostNetworkMonitor.mm -framework Foundation -framework Network -o build/metal/host-network-tests
          build/metal/host-network-tests
          xcrun clang++ -std=c++17 -fobjc-arc -Wall -Wextra -Werror -Wno-unused-parameter -I native/apple -I native/client tests/host_ping_tests.mm native/apple/MLHostPing.mm -framework Foundation -ldns_sd -o build/metal/host-ping-tests
          build/metal/host-ping-tests
      - run: build/metal/pyrowave-video --version
      - name: Verify the staged Metal source also builds through CMake
        run: |
          cmake -S . -B build/cmake-metal -DBUILD_TESTING=OFF -DBUILD_METAL_VIDEO_TOOL=ON
          cmake --build build/cmake-metal --target pyrowave-video --parallel 2
          build/cmake-metal/pyrowave-video --probe
      - name: Compile Apple5 pipelines and check dequant coefficients on the available GPU
        run: |
          python3 tools/embed_apple5_shader.py --check
          python3 tools/build_decoder_check.py --run
      - name: Execute the actual presenter and check color, range and image orientation
        run: |
          xcrun clang++ -std=c++17 -fobjc-arc -Wall -Wextra -Werror -I native/apple -I native/client tools/check_presenter_shader.mm -framework Metal -framework Foundation -o build/metal/check-presenter
          build/metal/check-presenter
      - name: Inspect available Metal backend
        id: gpu
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          probe = json.loads(subprocess.check_output(['build/metal/pyrowave-video', '--probe'], text=True))
          print(json.dumps(probe))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('supported=' + str(probe['native_backend_supported']).lower() + '\n')
          PYCODE
      - name: Install FFmpeg if a supported GPU is available
        if: steps.gpu.outputs.supported == 'true'
        run: |
          if ! command -v ffmpeg >/dev/null; then
            brew install ffmpeg
          fi
      - name: Validate real Metal encoding and reconstruction when possible
        if: steps.gpu.outputs.supported == 'true'
        run: |
          python3 tools/run_portable_tests.py
          python3 tools/encode_test_video.py --backend metal --roundtrip --width 320 --height 180 --fps 30 --frames 12 --output-dir benchmarks/local/mac-gpu-smoke
      # A Mac GPU test is not physical Apple TV qualification.
  tvos-client:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            sdk: appletvos
          - configuration: Release
            sdk: appletvos
          - configuration: Debug
            sdk: appletvsimulator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Record the selected Xcode and SDK
        run: |
          xcodebuild -version
          xcrun --sdk ${{ matrix.sdk }} --show-sdk-version
      - name: Build the integrated Moonlight TV target without signing
        run: python3 tools/build_tvos.py --sdk ${{ matrix.sdk }} --configuration ${{ matrix.configuration }}
      - name: Analyze the integrated device target for memory and control-flow issues
        if: matrix.configuration == 'Debug' && matrix.sdk == 'appletvos'
        run: python3 tools/build_tvos.py --sdk appletvos --configuration Debug --action analyze
      - name: Retain Xcode logs, diagnostics and result bundles even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xcode-${{ matrix.configuration }}-${{ matrix.sdk }}
          path: build/xcode/
          if-no-files-found: warn
          retention-days: 14
